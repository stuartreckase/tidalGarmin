<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>tidalGarmin</title>
  <defs>
    <!-- night-sky tile -->
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#132238"/>
      <stop offset="1" stop-color="#05090F"/>
    </radialGradient>
    <!-- neon tube: cyan at the apex fading to deep blue at the base -->
    <linearGradient id="tube" x1="0" y1="96" x2="0" y2="404" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3FE3FF"/>
      <stop offset="1" stop-color="#1F6BFF"/>
    </linearGradient>
    <filter id="bloom" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
    <filter id="halo" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="spark" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
    <!-- rounded delta: curved corners (28 px along each edge) -->
    <path id="delta" d="M241.9 120.2 Q256 96 270.1 120.2 L421.9 379.8 Q436 404 408 404 L104 404 Q76 404 90.1 379.8 Z"/>
    <!-- four-diamond mark: three across, one below centre (half-diagonal 24) -->
    <g id="mark">
      <path d="M208 252 L232 276 L208 300 L184 276 Z"/>
      <path d="M256 252 L280 276 L256 300 L232 276 Z"/>
      <path d="M304 252 L328 276 L304 300 L280 276 Z"/>
      <path d="M256 300 L280 324 L256 348 L232 324 Z"/>
    </g>
  </defs>

  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- faint stars -->
  <g fill="#9FB6D6" opacity="0.35">
    <circle cx="70" cy="88" r="1.6"/><circle cx="452" cy="132" r="1.2"/>
    <circle cx="398" cy="58" r="1.4"/><circle cx="118" cy="190" r="1"/>
    <circle cx="430" cy="300" r="1"/><circle cx="96" cy="452" r="1.3"/>
  </g>

  <!-- reflection pool under the triangle -->
  <ellipse cx="256" cy="448" rx="170" ry="16" fill="#1F6BFF" opacity="0.18" filter="url(#bloom)"/>

  <!-- neon triangle: bloom, tube, hot core -->
  <use href="#delta" fill="none" stroke="#1F7BFF" stroke-width="34" stroke-linejoin="round" opacity="0.55" filter="url(#bloom)"/>
  <use href="#delta" fill="none" stroke="url(#tube)" stroke-width="22" stroke-linejoin="round" filter="url(#halo)"/>
  <use href="#delta" fill="none" stroke="url(#tube)" stroke-width="18" stroke-linejoin="round"/>
  <use href="#delta" fill="none" stroke="#E8FBFF" stroke-width="5" stroke-linejoin="round" opacity="0.85"/>

  <!-- diamonds with a cool glow -->
  <use href="#mark" fill="#4FB8FF" opacity="0.7" filter="url(#spark)"/>
  <use href="#mark" fill="#FFFFFF"/>
</svg>
