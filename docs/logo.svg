<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>tidalGarmin</title>
  <defs>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#00FFFF"/>
      <stop offset="1" stop-color="#0055AA"/>
    </linearGradient>
    <clipPath id="tri">
      <path d="M256 52 L470 436 L42 436 Z"/>
    </clipPath>
  </defs>
  <!-- triangle body -->
  <path d="M256 52 L470 436 L42 436 Z" fill="#0A1F33"/>
  <!-- waves, clipped to the triangle -->
  <g clip-path="url(#tri)" fill="none" stroke-linecap="round">
    <path d="M40 300 q40 -26 80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#00FFFF" stroke-width="22"/>
    <path d="M40 350 q40 -26 80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#00AAFF" stroke-width="22"/>
    <path d="M40 400 q40 -22 80 0 t80 0 t80 0 t80 0 t80 0 t80 0" stroke="#0055AA" stroke-width="18"/>
  </g>
  <!-- diamond near the apex -->
  <path d="M256 150 L300 194 L256 238 L212 194 Z" fill="#FFFFFF"/>
  <!-- triangle edge -->
  <path d="M256 52 L470 436 L42 436 Z" fill="none" stroke="url(#edge)" stroke-width="18" stroke-linejoin="round"/>
</svg>
